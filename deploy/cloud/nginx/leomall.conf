# LeoMall 单机入口：
#   /            → H5 用户端静态文件
#   /admin/      → 管理后台静态文件
#   /leomall/    → 反代 Spring Boot（含 /leomall/wx/storage/fetch/ 商品图片）
# Agent 的 8000 端口不在此暴露：只允许后端 BFF 经容器内网调用。

# P2-10：按路径分类的入口限流。map 命中敏感路径时取客户端地址作为限流键，
# 其余路径键为空字符串——nginx 对空键不计入限流，从而无需重复 proxy 配置。
map $uri $leomall_auth_key {
    default "";
    ~^/leomall/(admin/auth/(login|kaptcha)|wx/auth/(login|regCaptcha|reset))$ $binary_remote_addr;
}
map $uri $leomall_upload_key {
    default "";
    ~^/leomall/wx/storage/upload$ $binary_remote_addr;
}
map $uri $leomall_chat_key {
    default "";
    ~^/leomall/wx/agent/chat$ $binary_remote_addr;
}
limit_req_zone $leomall_auth_key   zone=leomall_auth:10m   rate=10r/m;
limit_req_zone $leomall_upload_key zone=leomall_upload:10m rate=10r/m;
limit_req_zone $leomall_chat_key   zone=leomall_chat:10m   rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # P0-5：拦截路径规范化绕过变体（Shiro/Spring 路径语义差异，如 /..;/、
    # 编码空白、双重编码）。$uri 为 nginx 解码一次后的路径（不含 query），
    # 合法 API 路径不应包含 ".."、";"、"%" 或空白字符。
    if ($uri ~* "(\.\.|;|%|\s)") {
        return 400;
    }

    # P0-4：禁止浏览器 MIME 嗅探
    add_header X-Content-Type-Options nosniff always;
    # P2-10：基础安全响应头（CSP 待前端改造后另行启用，避免破坏现有内联样式）
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;   # 与后端 multipart 上限一致

    gzip on;
    gzip_min_length 2k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # H5 用户端（hash 路由，publicPath './'）
    root /usr/share/nginx/www/h5;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理后台（^~ 阻止下方静态资源正则抢走 /admin/ 下的 js/css）
    location ^~ /admin/ {
        alias /usr/share/nginx/www/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 后端 API + 本地存储图片，同源转发（前端无需 CORS）
    # ^~ 必须：否则 /leomall/wx/storage/fetch/xxx.jpg 会被下方图片正则截走导致 404
    location ^~ /leomall/ {
        # P2-10：登录/验证码/重置、上传、导购聊天分别限流（键为空的路径不受影响）
        limit_req zone=leomall_auth burst=5 nodelay;
        limit_req zone=leomall_upload burst=5 nodelay;
        limit_req zone=leomall_chat burst=10 nodelay;

        # 阶段1：启用 Redis 共享状态后后端可水平扩展多实例——会话已 Redis 化、
        # 用户端 JWT 无状态，无需 sticky session。扩容方法：compose 增加 backend2
        # 服务，在本文件顶部 http 上下文加：
        #   upstream leomall_backend { server backend:8080; server backend2:8080; }
        # 再把下面 proxy_pass 改为 http://leomall_backend;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 智能导购一轮最长约 60s（BFF read-timeout），留余量
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }
}

# P2-10：TLS 就绪模板。取得证书后取消注释并替换域名/证书路径，
