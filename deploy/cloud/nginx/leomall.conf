# LeoMall 单机入口：
#   /            → H5 用户端静态文件
#   /admin/      → 管理后台静态文件
#   /leomall/    → 反代 Spring Boot（含 /leomall/wx/storage/fetch/ 商品图片）
# Agent 的 8000 端口不在此暴露：只允许后端 BFF 经容器内网调用。
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;   # 与后端 multipart 上限一致

    gzip on;
    gzip_min_length 2k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # H5 用户端（hash 路由，publicPath './'）
    root /usr/share/nginx/www/h5;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理后台（^~ 阻止下方静态资源正则抢走 /admin/ 下的 js/css）
    location ^~ /admin/ {
        alias /usr/share/nginx/www/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 后端 API + 本地存储图片，同源转发（前端无需 CORS）
    # ^~ 必须：否则 /leomall/wx/storage/fetch/xxx.jpg 会被下方图片正则截走导致 404
    location ^~ /leomall/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 智能导购一轮最长约 60s（BFF read-timeout），留余量
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}