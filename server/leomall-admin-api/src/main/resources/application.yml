spring:
  profiles:
    active: db, core, admin
  messages:
    encoding: UTF-8

server:
  port: 8083

logging:
  level:
    root:  ERROR
    org.springframework:  ERROR
    org.mybatis:  ERROR
    com.leomall.admin:  DEBUG
    com.leomall:  ERROR

# 阶段2A：springdoc 开关（生产设 SWAGGER_ENABLED=false 关闭在线文档）
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}