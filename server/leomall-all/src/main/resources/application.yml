spring:
  profiles:
    active: db, core, admin, wx
  messages:
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain

logging:
  config: classpath:logback-spring.xml

# 阶段2A：springdoc 替代 springfox；单一开关 SWAGGER_ENABLED（默认 true）。
# 生产设 SWAGGER_ENABLED=false 整体关闭 /v3/api-docs 与 swagger-ui（原 swagger.production 开关）。
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}