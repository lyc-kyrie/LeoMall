# 阶段1：Redis 连接（仅 leomall.redis.enabled=true 时实际使用）
spring:
  autoconfigure:
    # 阶段2B：管理端会话由 AdminSessionConfig 显式装配（@EnableSpringHttpSession），
    # 排除 Boot 会话自动配置，避免 store-type 自动探测与条件装配冲突。
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  data:
    redis:
      host: ${LEOMALL_REDIS_HOST:localhost}
      port: ${LEOMALL_REDIS_PORT:6379}
      password: ${LEOMALL_REDIS_PASSWORD:}
      database: ${LEOMALL_REDIS_DB:0}
      timeout: 2000ms

leomall:
  # 阶段1：共享状态开关。false（默认）= 单实例内存实现，本机开发无需 Redis；
  # true = 验证码/登录锁定/下单去重/领券锁/聊天限流/管理端会话全部走 Redis，支持多实例。
  redis:
    enabled: ${LEOMALL_REDIS_ENABLED:false}

  # P1-1：跨域来源白名单（逗号分隔），默认空 = 不开放任何跨域来源。
  # 前端开发走 devServer 同源代理、生产走 nginx 同源，通常无需配置。
  cors:
    allowed-origins: ${LEOMALL_CORS_ALLOWED_ORIGINS:}

  # 开发者应该设置成自己的wx相关信息
  # P1-7：app-secret 不再入库（git），通过环境变量注入
  wx:
    app-id: wxa5b486c6b918ecfb
    app-secret: ${LEOMALL_WX_APP_SECRET:}
    mch-id: 111111
    mch-key: xxxxxx
    notify-url: http://localhost:8080/leomall/wx/order/pay-notify
    # 商户证书文件路径
    # 请参考“商户证书”一节 https://pay.weixin.qq.com/wiki/doc/api/wxa/wxa_api.php?chapter=4_3
    key-path: xxxxx
    # 消息推送配置token
    token:
    # 消息推送配置AesKey
    aes-key:

  #通知相关配置
  notify:
    mail:
      # 邮件通知配置,邮箱一般用于接收业务通知例如收到新的订单，sendto 定义邮件接收者，通常为商城运营人员
      enable: false
      host: smtp.exmail.qq.com
      username: ex@ex.com.cn
      password: XXXXXXXXXXXXX
      sendfrom: ex@ex.com.cn
      sendto: ex@qq.com
      port: 465
    # 短消息模版通知配置
    # 短信息用于通知客户，例如发货短信通知，注意配置格式；template-name，template-templateId 请参考 NotifyType 枚举值
    sms:
      enable: false
      # 如果是腾讯云短信，则设置active的值tencent
      # 如果是阿里云短信，则设置active的值aliyun
      active: tencent
      sign: leomall
      template:
      - name: paySucceed
        templateId: 156349
      - name: captcha
        templateId: 156433
      - name: ship
        templateId: 158002
      - name: refund
        templateId: 159447
      tencent:
        appid: 111111111
        appkey: xxxxxxxxxxxxxx
      aliyun:
        regionId: xxx
        accessKeyId: xxx
        accessKeySecret: xxx

  # 快鸟物流查询配置
  express:
    enable: false
    appId: "XXXXXXXXX"
    appKey: "XXXXXXXXXXXXXXXXXXXXXXXXX"
    vendors:
    - code: "ZTO"
      name: "中通快递"
    - code: "YTO"
      name: "圆通速递"
    - code: "YD"
      name: "韵达速递"
    - code: "YZPY"
      name: "邮政快递包裹"
    - code: "EMS"
      name: "EMS"
    - code: "DBL"
      name: "德邦快递"
    - code: "FAST"
      name: "快捷快递"
    - code: "ZJS"
      name: "宅急送"
    - code: "TNT"
      name: "TNT快递"
    - code: "UPS"
      name: "UPS"
    - code: "DHL"
      name: "DHL"
    - code: "FEDEX"
      name: "FEDEX联邦(国内件)"
    - code: "FEDEX_GJ"
      name: "FEDEX联邦(国际件)"

  # 对象存储配置
  storage:
    # 当前工作的对象存储模式，分别是local、aliyun、tencent、qiniu
    active: local
    # 本地对象存储配置信息
    local:
      storagePath: storage
      # 这个地方应该是wx模块的WxStorageController的fetch方法对应的地址
      address: http://localhost:8080/leomall/wx/storage/fetch/
    # 阿里云对象存储配置信息
    aliyun:
      endpoint: oss-cn-shenzhen.aliyuncs.com
      accessKeyId: 111111
      accessKeySecret: xxxxxx
      bucketName: leomall
    # 腾讯对象存储配置信息
    # 请参考 https://cloud.tencent.com/document/product/436/6249
    # P1-7：密钥不再入库（git），通过环境变量注入
    tencent:
      secretId: ${LEOMALL_COS_SECRET_ID:}
      secretKey: ${LEOMALL_COS_SECRET_KEY:}
      region: ap-shanghai
      bucketName: vytech-1300096589
    # 七牛云对象存储配置信息
    qiniu:
      endpoint: http://pd5cb6ulu.bkt.clouddn.com
      accessKey: 111111
      secretKey: xxxxxx
      bucketName: leomall