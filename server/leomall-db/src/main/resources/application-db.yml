pagehelper:
  helperDialect:  mysql
  reasonable: true
  supportMethodsArguments:  true
  params: count=countSql

spring:
  datasource:
    druid:
      # P1-7：支持环境变量覆盖；默认值仅用于本机开发（与 sql/leomall_schema.sql 对齐），
      # 生产必须通过 LEOMALL_MYSQL_URL / LEOMALL_MYSQL_USER / LEOMALL_MYSQL_PASSWORD 注入。
      url:  ${LEOMALL_MYSQL_URL:jdbc:mysql://localhost:3306/leomall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&verifyServerCertificate=false&useSSL=false}
      driver-class-name:  com.mysql.cj.jdbc.Driver
      username:  ${LEOMALL_MYSQL_USER:leomall}
      password:  ${LEOMALL_MYSQL_PASSWORD:123456}
      initial-size:  10
      max-active:  50
      min-idle:  10
      max-wait:  60000
      pool-prepared-statements:  true
      max-pool-prepared-statement-per-connection-size:  20
      validation-query:  SELECT 1 FROM DUAL
      test-on-borrow:  false
      test-on-return:  false
      test-while-idle:  true
      time-between-eviction-runs-millis:  60000
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: false
      filter:
        stat:
          enabled: false
