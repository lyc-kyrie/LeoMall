# 智能导购 Agent（外部 Python 服务）接入配置
# 该服务只监听 127.0.0.1，由 Spring Boot 作为 BFF 转发，不直接暴露给用户端。
leomall:
  # 用户端 JWT 签名密钥（P0-1）：必须由环境变量 LEOMALL_JWT_SECRET 注入，
  # >=32 字符强随机串；未配置应用拒绝启动。更换密钥即令存量 token 全部失效。
  jwt-secret: ${LEOMALL_JWT_SECRET:}
  agent:
    base-url: http://127.0.0.1:8000
    # 必须与 leomall-agent 的 INTERNAL_API_TOKEN 一致；留空则不发送。
    # 不提供任何默认值（P0-6）：默认值会随 jar 分发等于公开凭据。
    # 开发/生产都用环境变量 LEOMALL_AGENT_INTERNAL_TOKEN 注入，两侧保持一致。
    internal-token: ${LEOMALL_AGENT_INTERNAL_TOKEN:}
    connect-timeout-ms: ${LEOMALL_AGENT_CONNECT_TIMEOUT_MS:3000}
    # 阶段2C：60s → 45s（审计 P1-8「更短超时」），可环境变量覆盖
    read-timeout-ms: ${LEOMALL_AGENT_READ_TIMEOUT_MS:45000}
    top-k: 5
    # 阶段2C：chat 异步化——独立有界线程池承载阻塞调用，Tomcat 线程即时释放。
    # threads=并发执行上限；queue-capacity=排队上限，超出立即 802 快速失败；
    # async-timeout-ms=Servlet 异步超时（须 > connect+read+落库耗时）。
    chat:
      threads: ${LEOMALL_AGENT_CHAT_THREADS:16}
      queue-capacity: ${LEOMALL_AGENT_CHAT_QUEUE:64}
      async-timeout-ms: ${LEOMALL_AGENT_CHAT_ASYNC_TIMEOUT_MS:55000}
