# 智能导购 Agent（外部 Python 服务）接入配置
# 该服务只监听 127.0.0.1，由 Spring Boot 作为 BFF 转发，不直接暴露给用户端。
leomall:
  agent:
    base-url: http://127.0.0.1:8000
    # 必须与 leomall-agent 的 INTERNAL_API_TOKEN 一致；留空则不发送（仅本机调试）
    # 生产用环境变量 LEOMALL_AGENT_INTERNAL_TOKEN 注入；下方默认值仅供本机开发，
    # 会随 jar 分发，切勿在此放置真实凭据。
    internal-token: ${LEOMALL_AGENT_INTERNAL_TOKEN:leomall-agent-dev-2026}
    connect-timeout-ms: 3000
    read-timeout-ms: 60000
    top-k: 5
